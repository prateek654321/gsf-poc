<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var p = window.location.pathname;
      var s = window.location.search || '';
      var h = window.location.hash || '';
      // Automatic routing for clean extensionless URLs and homepage
      if (p === '/' || p === '' || p === '/index') {
        fetch('/index.html' + s + h)
          .then(function(res) {
            if (!res.ok) throw new Error('Fetch failed');
            return res.text();
          })
          .then(function(html) {
            document.open();
            document.write(html);
            document.close();
            if (window.location.pathname !== '/') {
              window.history.replaceState({}, '', '/' + s + h);
            }
          })
          .catch(function() {
            window.location.replace('/index.html' + s + h);
          });
        return;
      } else if (p === '/categories' || p === '/categories/') {
        window.location.replace('/categories.html' + s + h);
      } else if (p === '/plp' || p === '/plp/') {
        window.location.replace('/plp.html' + s + h);
      } else if (p === '/pdp' || p === '/pdp/') {
        window.location.replace('/pdp.html' + s + h);
      } else if (p === '/parts' || p === '/parts/') {
        window.location.replace('/plp.html?category_id=5275&category_name=Car%20Parts' + (s ? '&' + s.slice(1) : '') + h);
      } else if (p === '/parts/service-parts' || p === '/parts/service-parts/') {
        window.location.replace('/plp.html?category_id=5278&category_name=Service%20Parts' + (s ? '&' + s.slice(1) : '') + h);
      } else if (p === '/parts/service-parts/wiper-blades' || p === '/parts/service-parts/wiper-blades/') {
        window.location.replace('/plp.html?category_id=5389&category_name=Wiper%20Blades' + (s ? '&' + s.slice(1) : '') + h);
      } else if (p === '/parts/service-parts/wiper-blades/wiper-blades' || p === '/parts/service-parts/wiper-blades/wiper-blades/') {
        window.location.replace('/plp.html?category_id=5392&category_name=Wiper%20Blades' + (s ? '&' + s.slice(1) : '') + h);
      } else if (p === '/parts/braking' || p === '/parts/braking/') {
        window.location.replace('/plp.html?category_id=5461&category_name=Braking' + (s ? '&' + s.slice(1) : '') + h);
      } else if (p.startsWith('/parts/braking/brake-pads-discs')) {
        window.location.replace('/plp.html?category_id=5464&category_name=Brake%20Pads%20%26%20Discs' + (s ? '&' + s.slice(1) : '') + h);
      } else if (p.startsWith('/parts/braking/brake-pads')) {
        window.location.replace('/plp.html?category_id=5467&category_name=Brake%20Pads' + (s ? '&' + s.slice(1) : '') + h);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — GSF Car Parts</title>
  <link rel="stylesheet" href="/styles/styles.css" />
  <script src="/scripts/aem.js" type="module"></script>
  <script src="/scripts/scripts.js" type="module"></script>
</head>
<body>
  <header class="header"></header>
  <main>
    <div class="section" style="text-align: center; padding: 5rem 1rem;">
      <h1>404 — Page Not Found</h1>
      <p>The page you are looking for doesn't exist or has been moved.</p>
      <a href="/" class="btn btn-primary" style="margin-top: 1rem;">Return to Homepage</a>
    </div>
  </main>
  <footer class="footer"></footer>
</body>
</html>
